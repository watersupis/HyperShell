name: External Plugin Packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional existing release tag to attach packages to
        required: false
        type: string
  push:
    tags:
      - 'v*'

concurrency:
  group: external-plugin-packages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and package external plugins
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          manifests=(plugins/external/*/plugin.json)
          if ((${#manifests[@]} == 0)); then
            echo 'No external plugin manifests found.' >&2
            exit 1
          fi
          for manifest in "${manifests[@]}"; do
            plugin_dir="${manifest%/plugin.json}"
            echo "Packaging ${plugin_dir}"
            pnpm plugin:pack -- "$plugin_dir"
          done

      - name: Upload plugin packages
        uses: actions/upload-artifact@v4
        with:
          name: hypershell-external-plugins-${{ github.run_id }}
          path: plugins/external/*/.packages/*.hspkg
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Attach plugin packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" --generate-notes --title "$TAG" || true
          shopt -s nullglob
          packages=(plugins/external/*/.packages/*.hspkg)
          if ((${#packages[@]} == 0)); then
            echo 'No plugin packages were generated.' >&2
            exit 1
          fi
          gh release upload "$TAG" "${packages[@]}" --clobber
