name: Windows Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to upload assets to
        required: false
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # Pinned, not windows-latest: that label moved to Visual Studio 2026 (major
    # version 18) in June 2026, and neither the node-gyp bundled with pnpm nor
    # @electron/rebuild recognizes it — both report "unknown version undefined"
    # and fail to build @vscode/windows-process-tree. Unpin once both ship
    # VS 2026 detection.
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Fails before anything is built or published if the tag disagrees with the
      # versions committed at this ref.
      - name: Verify tag matches package versions
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        run: node .tools/release/verify-tag-version.mjs --ref-name "${{ inputs.release_tag || github.ref_name }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @hypershell/ui exec playwright install chromium

      - name: Lint
        run: pnpm ci:lint

      - name: Workspace build
        run: pnpm ci:build

      - name: Workspace unit tests
        run: pnpm ci:test

      - name: Playwright smoke
        run: pnpm ci:test:e2e

      - name: Rebuild native modules for Electron
        run: pnpm --filter @hypershell/desktop rebuild:native

      # Boots the real shell (preload bridge, IPC schemas, SQLite, windows)
      # against a throwaway data directory before anything is packaged.
      - name: Build desktop bundle
        run: pnpm --filter @hypershell/desktop run build:bundle

      - name: Electron E2E
        run: pnpm ci:test:e2e:electron

      - name: Package Windows release (unsigned)
        run: pnpm release:windows:unsigned

      - name: Create Windows ZIP distribution
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          Compress-Archive `
            -Path "apps/desktop/release/win-unpacked/*" `
            -DestinationPath "apps/desktop/release/hypershell-$version-win-x64.zip" `
            -CompressionLevel Optimal

      - name: Generate release manifest
        run: pnpm release:manifest

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.ref_name }}
          path: apps/desktop/release/**
          if-no-files-found: error
          retention-days: 30

      - name: Attach Windows builds to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          TAG="$RELEASE_TAG"
          gh release create "$TAG" --generate-notes --title "$TAG" || true
          cd apps/desktop/release
          INSTALLER=$(find . -maxdepth 1 -name 'hypershell-*-x64.exe' ! -name '*-portable.exe' | head -1)
          ZIP=$(find . -maxdepth 1 -name 'hypershell-*-win-x64.zip' | head -1)
          if [ -z "$INSTALLER" ] || [ -z "$ZIP" ]; then
            echo "Missing Windows installer or ZIP distribution"
            exit 1
          fi
          echo "Uploading Windows installer $INSTALLER and ZIP distribution $ZIP to release $TAG"
          gh release upload "$TAG" "$INSTALLER" "$ZIP" --clobber
          # Upload auto-update metadata LAST so a polling client never sees
          # an advertised version before its installer asset exists.
          [ -f latest.yml ] && gh release upload "$TAG" latest.yml --clobber || true
          for BLOCKMAP in *.blockmap; do
            [ -e "$BLOCKMAP" ] && gh release upload "$TAG" "$BLOCKMAP" --clobber || true
          done
